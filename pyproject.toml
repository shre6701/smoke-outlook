[project]
name = "smoke-outlook"
version = "0.0.0"
description = "Smoke & GRAP Outlook (South Asia)"
requires-python = ">=3.12"
dependencies = [
    "cfgrib>=0.9.15.1",
    "fastapi>=0.163.0",
    "herbie-data>=2026.10.0",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.1",
    "pyspark>=4.3.0",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=4",
    "httpx>=0.28.1",
    "playwright>=1.65.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["db: needs the Postgres container running"]
